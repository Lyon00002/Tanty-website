<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FECC00" />
    <title>Hors connexion · TANTY</title>
    <!--
      The page shown when a TANTY page cannot load without a connection
      (served by public/sw.js). Self-contained: its styles are inline and its
      only image, the logo, is kept by the service worker.
    -->
    <style>
      :root {
        --ink: #11241a;
        --ink-soft: #2c3f2f;
        --green: #1b6430;
        --green-deep: #0f3a1e;
        --yellow: #fecc00;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #fff;
        color: var(--ink);
        font-family: "Libre Franklin", "Franklin Gothic Medium", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      ::selection {
        background: var(--green);
        color: var(--yellow);
      }
      main {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 3rem 1.25rem 2rem;
      }
      .card {
        width: 100%;
        max-width: 36rem;
        text-align: center;
      }
      .logo {
        display: block;
        width: 9.5rem;
        height: auto;
        margin: 0 auto;
      }
      h1 {
        margin: 2.75rem 0 0;
        font-size: clamp(2rem, 1.4rem + 2.4vw, 2.9rem);
        font-weight: 800;
        line-height: 1.08;
        letter-spacing: -0.025em;
        text-wrap: balance;
      }
      h1 .accent {
        color: var(--green);
      }
      h1 .dot {
        color: var(--yellow);
      }
      p {
        margin: 1.25rem auto 0;
        max-width: 30rem;
        font-size: 1.0625rem;
        line-height: 1.6;
        color: var(--ink-soft);
      }
      .actions {
        margin-top: 2.25rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
      }
      button {
        display: inline-flex;
        min-height: 3rem;
        min-width: 12.5rem;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.75rem 1.75rem;
        border: 0;
        border-radius: 2px;
        background: var(--green);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      button:hover {
        background: var(--green-deep);
      }
      :focus-visible {
        outline: 3px solid var(--green-deep);
        outline-offset: 4px;
        border-radius: 6px;
      }
      .call {
        margin: 0;
        font-size: 0.9375rem;
      }
      .call a {
        color: var(--ink);
        font-weight: 700;
        text-decoration: underline;
        text-decoration-thickness: 2px;
        text-underline-offset: 0.24em;
        text-decoration-color: rgb(17 36 26 / 0.45);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .ribbon {
        display: block;
        width: 100%;
        height: 2rem;
        margin-top: 3.5rem;
      }
      .waiting {
        margin-top: 0.75rem;
        font-size: 0.875rem;
        color: var(--ink-soft);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <img class="logo" src="/brand/logo/tanty-logo.png" alt="TANTY" width="900" height="440" />
        <h1>Vous êtes <span class="accent">hors connexion</span><span class="dot">.</span></h1>
        <p>Cette page ne peut pas s'afficher sans internet. Vérifiez votre connexion, puis réessayez.</p>
        <div class="actions">
          <button type="button" id="retry">Réessayer</button>
          <p class="call">Pour commander en attendant, appelez-nous au <a href="tel:+237690796240">+237 690 79 62 40</a>.</p>
        </div>
        <p class="waiting" id="waiting" hidden>La page se recharge dès que la connexion revient.</p>

        </svg>
      </div>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        location.reload();
      });
      document.getElementById("waiting").hidden = false;
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
